spring.application.name=DigiBank
spring.profiles.active=dev
spring.thymeleaf.cache=false
server.port=8080
digibank.card-security.key=${DIGIBANK_CARD_SECURITY_KEY:digibank-development-card-key-change-me}
server.error.include-stacktrace=never
server.error.include-message=never
spring.web.error.whitelabel.enabled=false
digibank.password-reset.show-link=${DIGIBANK_PASSWORD_RESET_SHOW_LINK:true}
digibank.loan-document-storage=${DIGIBANK_LOAN_DOCUMENT_STORAGE:uploads/loan-documents}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
