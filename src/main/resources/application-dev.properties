# Development database configuration.
# Local credentials must be supplied through environment variables.
spring.datasource.url=${DIGIBANK_DB_URL:jdbc:mysql://localhost:3306/digibank_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${DIGIBANK_DB_USERNAME:root}
spring.datasource.password=${DIGIBANK_DB_PASSWORD:}

# Version-controlled SQL migrations.
spring.flyway.enabled=${DIGIBANK_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# JPA and SQL logging.
# Flyway owns schema creation; Hibernate validates entity/schema consistency.
spring.jpa.hibernate.ddl-auto=${DIGIBANK_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=${DIGIBANK_JPA_OPEN_IN_VIEW:false}
spring.jpa.show-sql=${DIGIBANK_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${DIGIBANK_HIBERNATE_FORMAT_SQL:true}
