<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transfers - DigiBank Staff</title><link rel="icon" type="image/png" th:href="@{/images/logo/logo.png}"><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/staff.css}"></head>
<body class="staff-shell"><div th:replace="~{fragments/staff-layout :: topbar}"></div><div class="staff-layout"><div th:replace="~{fragments/staff-layout :: sidebar('transfers')}"></div><main class="staff-main"><div th:replace="~{fragments/staff-layout :: alerts}"></div>
<section class="staff-page-head"><div><p class="staff-eyebrow">Transfer operations</p><h1>Transfers</h1><p>Search transfers and create an auditable compensating reversal when required.</p></div></section>
<form class="staff-filter" method="get" th:action="@{/staff/transfers}"><label>Search<input name="query" th:value="${query}" placeholder="Reference, customer or recipient"></label><label>Status<select name="status"><option value="">All statuses</option><option th:each="s:${transferStatuses}" th:value="${s}" th:text="${s}" th:selected="${s == selectedStatus}"></option></select></label><button class="staff-btn primary" type="submit">Apply filters</button></form>
<div class="staff-empty" th:if="${transfers.empty}">No transfers match these filters.</div><section class="staff-table-card" th:unless="${transfers.empty}"><table class="staff-record-table"><thead><tr><th>Reference</th><th>Customer</th><th>Recipient</th><th>Amount</th><th>Status</th><th>Completed</th><th></th></tr></thead><tbody><tr th:each="t:${transfers.content}"><td class="mono-value" th:text="${t.referenceNumber}">TRF</td><td><strong th:text="${t.customerName}">Name</strong><small th:text="${t.customerNumber}">CUS</small></td><td><strong th:text="${t.recipientName}">Recipient</strong><small th:text="${t.destinationAccount}">****</small></td><td th:text="${'LKR '+#numbers.formatDecimal(t.amount,1,2)}">LKR</td><td><em class="status-chip" th:classappend="${t.status.name().toLowerCase()}" th:text="${t.status}">STATUS</em></td><td th:text="${t.completedAt == null ? '—' : #temporals.format(t.completedAt,'dd MMM yyyy HH:mm')}">Date</td><td><a th:href="@{/staff/transfers/{ref}(ref=${t.referenceNumber})}">Open</a></td></tr></tbody></table></section>
<nav class="staff-pagination" th:if="${transfers.totalPages > 1}"><a class="staff-btn secondary" th:if="${transfers.hasPrevious()}" th:href="@{/staff/transfers(query=${query},status=${selectedStatus},page=${transfers.number-1},size=${transfers.size})}">Previous</a><span th:text="${'Page '+(transfers.number+1)+' of '+transfers.totalPages}">Page</span><a class="staff-btn secondary" th:if="${transfers.hasNext()}" th:href="@{/staff/transfers(query=${query},status=${selectedStatus},page=${transfers.number+1},size=${transfers.size})}">Next</a></nav>
</main></div><div th:replace="~{fragments/staff-layout :: footer}"></div></body></html>
