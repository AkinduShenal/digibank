<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Payments - DigiBank Staff</title><link rel="icon" type="image/png" th:href="@{/images/logo/logo.png}"><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/staff.css}"></head><body class="staff-shell"><div th:replace="~{fragments/staff-layout :: topbar}"></div><div class="staff-layout"><div th:replace="~{fragments/staff-layout :: sidebar('bills')}"></div><main class="staff-main"><div th:replace="~{fragments/staff-layout :: alerts}"></div>
<section class="staff-page-head"><div><p class="staff-eyebrow">Payment operations</p><h1>Bill payments</h1><p>Search completed utility and service payments with a full audit trail.</p></div></section>
<form class="staff-filter" method="get"><label>Search<input name="q" th:value="${query}" placeholder="Reference, customer or provider"></label><label>Category<select name="category"><option value="">All categories</option><option th:each="c:${billerCategories}" th:value="${c}" th:text="${c.displayName}" th:selected="${c==selectedCategory}"></option></select></label><button class="staff-btn primary">Filter</button></form>
<div class="staff-empty" th:if="${#lists.isEmpty(payments)}">No bill payments match these filters.</div><section class="staff-table-card" th:unless="${#lists.isEmpty(payments)}"><table class="staff-record-table"><thead><tr><th>Reference</th><th>Customer</th><th>Provider</th><th>Service reference</th><th>Amount</th><th>Paid</th><th></th></tr></thead><tbody><tr th:each="p:${payments}"><td class="mono-value" th:text="${p.referenceNumber}">BIL</td><td><strong th:text="${p.customerName}">Name</strong><small th:text="${p.category.displayName}">Category</small></td><td th:text="${p.providerName}">Provider</td><td class="mono-value" th:text="${p.maskedConsumerReference}">****</td><td><strong th:text="${'LKR '+#numbers.formatDecimal(p.amount,1,2)}">LKR</strong></td><td th:text="${#temporals.format(p.paidAt,'dd MMM yyyy HH:mm')}">Date</td><td><a th:href="@{/staff/bill-payments/{ref}(ref=${p.referenceNumber})}">Open</a></td></tr></tbody></table></section>
<nav class="staff-pagination" th:if="${paymentsPage.totalPages>1}"><a class="staff-btn secondary" th:if="${paymentsPage.hasPrevious()}" th:href="@{/staff/bill-payments(q=${query},category=${selectedCategory},page=${paymentsPage.number-1},size=${paymentsPage.size})}">Previous</a><span th:text="${'Page '+(paymentsPage.number+1)+' of '+paymentsPage.totalPages}"></span><a class="staff-btn secondary" th:if="${paymentsPage.hasNext()}" th:href="@{/staff/bill-payments(q=${query},category=${selectedCategory},page=${paymentsPage.number+1},size=${paymentsPage.size})}">Next</a></nav>
</main></div><div th:replace="~{fragments/staff-layout :: footer}"></div></body></html>
