<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications - DigiBank</title>
  <link rel="icon" type="image/png" th:href="@{/images/logo/logo.png}">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
  <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body class="customer-shell">
<div th:replace="~{fragments/customer-layout :: topbar}"></div>
<main class="customer-layout">
  <div th:replace="~{fragments/customer-layout :: sidebar}"></div>
  <section class="customer-content">
    <div th:replace="~{fragments/customer-layout :: alerts}"></div>
    <div class="welcome-band">
      <div><p class="eyebrow">Customer inbox</p><h1>Notifications</h1><span class="mono" th:text="${unreadCount + ' unread'}">0 unread</span></div>
      <form th:if="${unreadCount > 0}" th:action="@{/customer/notifications/read-all}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-prev" type="submit">Mark all as read</button>
      </form>
    </div>
    <div class="empty-state" th:if="${#lists.isEmpty(notifications)}"><h2>No notifications</h2><p>Incoming transfers and account notices will appear here.</p></div>
    <div class="notification-list" th:unless="${#lists.isEmpty(notifications)}">
      <article th:each="notification : ${notifications}" th:classappend="${notification.read ? '' : ' unread'}">
        <span class="notification-mark" th:text="${notification.read ? '✓' : '●'}">●</span>
        <div><h2 th:text="${notification.title}">Notification</h2><p th:text="${notification.message}">Message</p>
          <small th:text="${#temporals.format(notification.createdAt, 'dd MMM yyyy HH:mm')}">Date</small></div>
        <form th:unless="${notification.read}" th:action="@{/customer/notifications/{id}/read(id=${notification.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-prev" type="submit">Mark read</button>
        </form>
      </article>
    </div>
  </section>
</main>
<div th:replace="~{fragments/customer-layout :: footer}"></div>
</body>
</html>
