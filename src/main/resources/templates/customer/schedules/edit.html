<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Schedule - DigiBank</title><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/customer.css}"></head><body class="customer-shell"><div th:replace="~{fragments/customer-layout :: topbar}"></div><main class="customer-layout"><div th:replace="~{fragments/customer-layout :: sidebar}"></div><section class="customer-content"><div class="welcome-band"><div><p class="eyebrow">Payment automation</p><h1>Edit schedule</h1><span th:text="${reference}"></span></div></div><form class="profile-form management-card" th:action="@{/customer/schedules/{r}/edit(r=${reference})}" th:object="${updateRequest}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid"><label>Amount<input type="number" min="0.01" max="1000000" step="0.01" th:field="*{amount}" required></label><label>Recurrence<select th:field="*{recurrence}"><option value="ONCE">One time</option><option value="MONTHLY">Monthly</option></select></label><label>Next execution<input type="datetime-local" th:field="*{nextExecutionAt}" required></label><label>End date<input type="date" th:field="*{endDate}"></label><label>Description<input th:field="*{description}" maxlength="140"></label></div><div class="form-actions"><a class="btn btn-prev" th:href="@{/customer/schedules/{r}(r=${reference})}">Back</a><button class="btn btn-save" type="submit">Save changes</button></div></form></section></main><div th:replace="~{fragments/customer-layout :: footer}"></div></body></html>
