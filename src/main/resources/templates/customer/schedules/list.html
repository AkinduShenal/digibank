<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheduled Payments - DigiBank</title><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/customer.css}"></head>
<body class="customer-shell"><div th:replace="~{fragments/customer-layout :: topbar}"></div><main class="customer-layout"><div th:replace="~{fragments/customer-layout :: sidebar}"></div><section class="customer-content"><div th:replace="~{fragments/customer-layout :: alerts}"></div>
<div class="welcome-band"><div><p class="eyebrow">Payment automation</p><h1>Scheduled payments</h1><span>Review recurring transfers and bill payments from one secure place.</span></div><a class="btn btn-save" th:href="@{/customer/schedules/new}">New schedule</a></div>
<div class="empty-state" th:if="${#lists.isEmpty(schedules)}"><h2>No scheduled payments yet</h2><p>Create a one-time or monthly payment.</p></div>
<div class="management-card" th:unless="${#lists.isEmpty(schedules)}"><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Type / destination</th><th>Next payment</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="item:${schedules}"><td th:text="${item.reference}"></td><td><strong th:text="${item.paymentType}"></strong><small th:text="${item.destination}"></small></td><td th:text="${#temporals.format(item.nextExecutionAt,'dd MMM yyyy HH:mm')}"></td><td th:text="${'LKR '+item.amount}"></td><td><span class="status-pill" th:text="${item.status}"></span></td><td><a class="btn btn-prev" th:href="@{/customer/schedules/{r}(r=${item.reference})}">View</a></td></tr></tbody></table></div></div>
</section></main><div th:replace="~{fragments/customer-layout :: footer}"></div></body></html>
