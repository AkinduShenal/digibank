<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Details - DigiBank</title><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/customer.css}"></head><body class="customer-shell"><div th:replace="~{fragments/customer-layout :: topbar}"></div><main class="customer-layout"><div th:replace="~{fragments/customer-layout :: sidebar}"></div><section class="customer-content"><div th:replace="~{fragments/customer-layout :: alerts}"></div><div class="welcome-band"><div><p class="eyebrow">Scheduled payment</p><h1 th:text="${schedule.reference}"></h1><span th:text="${schedule.paymentType+' · '+schedule.recurrence}"></span></div><span class="status-pill" th:text="${schedule.status}"></span></div><div class="management-card detail-grid"><div><small>From</small><strong th:text="${schedule.sourceAccount}"></strong></div><div><small>To</small><strong th:text="${schedule.destination}"></strong></div><div><small>Amount</small><strong th:text="${'LKR '+schedule.amount}"></strong></div><div><small>Next execution</small><strong th:text="${#temporals.format(schedule.nextExecutionAt,'dd MMM yyyy HH:mm')}"></strong></div><div><small>Executions</small><strong th:text="${schedule.executionCount}"></strong></div><div th:if="${schedule.failureReason}"><small>Failure reason</small><strong th:text="${schedule.failureReason}"></strong></div></div><div class="form-actions" th:if="${schedule.status.name()=='SCHEDULED'}"><a class="btn btn-prev" th:href="@{/customer/schedules/{r}/edit(r=${schedule.reference})}">Edit schedule</a><form th:action="@{/customer/schedules/{r}/cancel(r=${schedule.reference})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-danger" type="submit">Cancel schedule</button></form></div></section></main><div th:replace="~{fragments/customer-layout :: footer}"></div></body></html>
