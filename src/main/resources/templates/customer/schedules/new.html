<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Schedule - DigiBank</title><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/customer.css}"></head>
<body class="customer-shell"><div th:replace="~{fragments/customer-layout :: topbar}"></div><main class="customer-layout"><div th:replace="~{fragments/customer-layout :: sidebar}"></div><section class="customer-content"><div th:replace="~{fragments/customer-layout :: alerts}"></div><div class="welcome-band"><div><p class="eyebrow">Payment automation</p><h1>Create a schedule</h1><span>Set up a one-time or monthly transfer or bill payment.</span></div></div>
<form class="profile-form management-card schedule-form" th:action="@{/customer/schedules}" th:object="${scheduleRequest}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid">
<label>Payment type<select th:field="*{paymentType}" required><option value="">Select type</option><option th:each="v:${paymentTypes}" th:value="${v}" th:text="${v}"></option></select></label>
<label>Source account<select th:field="*{sourceAccountNumber}" required><option value="">Select account</option><option th:each="a:${transferForm.accounts}" th:value="${a.accountNumber}" th:text="${a.maskedAccountNumber+' · LKR '+a.availableBalance}"></option></select></label>
<label>Amount<input type="number" min="0.01" max="1000000" step="0.01" th:field="*{amount}" required></label><label>Recurrence<select th:field="*{recurrence}"><option th:each="v:${recurrences}" th:value="${v}" th:text="${v}"></option></select></label>
<label>First execution<input type="datetime-local" th:field="*{nextExecutionAt}" required></label><label>End date (monthly only)<input type="date" th:field="*{endDate}"></label>
</div><fieldset><legend>Transfer details (when type is FUND_TRANSFER)</legend><div class="form-grid"><label>Recipient type<select th:field="*{transferRecipientType}"><option value="">Select</option><option th:each="v:${recipientTypes}" th:value="${v}" th:text="${v}"></option></select></label><label>Saved beneficiary<select th:field="*{beneficiaryId}"><option value="">Select beneficiary</option><option th:each="b:${transferForm.beneficiaries}" th:value="${b.id}" th:text="${b.name+' · '+b.maskedAccountNumber}"></option></select></label><label>Other DigiBank account<input th:field="*{destinationAccountNumber}" maxlength="12"></label><label>My destination account<select th:field="*{ownDestinationAccountNumber}"><option value="">Select own account</option><option th:each="a:${transferForm.accounts}" th:value="${a.accountNumber}" th:text="${a.maskedAccountNumber}"></option></select></label></div></fieldset>
<fieldset><legend>Bill details (when type is BILL_PAYMENT)</legend><div class="form-grid"><label>Biller option<select th:field="*{billerSelectionType}"><option value="">Select</option><option th:each="v:${billerTypes}" th:value="${v}" th:text="${v}"></option></select></label><label>Saved biller<select th:field="*{savedBillerId}"><option value="">Select saved biller</option><option th:each="b:${billForm.savedBillers}" th:value="${b.id}" th:text="${b.nickname+' · '+b.providerName}"></option></select></label><label>New provider<select th:field="*{billerProvider}"><option value="">Select provider</option><option th:each="p:${billForm.providers}" th:value="${p.provider}" th:text="${p.displayName}"></option></select></label><label>Consumer reference<input th:field="*{consumerReference}" maxlength="50"></label></div></fieldset>
<div class="form-grid"><label>Description<input th:field="*{description}" maxlength="140"></label><label>Transaction PIN<input type="password" inputmode="numeric" maxlength="4" th:field="*{transactionPin}" required></label></div><div class="auth-alert error" th:if="${#fields.hasAnyErrors()}">Please correct the highlighted schedule details.</div><div class="form-actions"><a class="btn btn-prev" th:href="@{/customer/schedules}">Cancel</a><button class="btn btn-save" type="submit">Create schedule</button></div></form>
</section></main><div th:replace="~{fragments/customer-layout :: footer}"></div></body></html>
