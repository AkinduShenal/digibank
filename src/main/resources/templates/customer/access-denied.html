<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Unavailable - DigiBank</title>
<link rel="icon" type="image/png" th:href="@{/images/logo/logo.png}">
<link rel="apple-touch-icon" th:href="@{/images/logo/logo.png}">
<link rel="stylesheet" th:href="@{/css/auth.css}">
<link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body class="customer-shell">
<div th:replace="~{fragments/customer-layout :: topbar}"></div>
<main class="customer-content narrow">
  <div class="notice">
    <div class="ic">!</div>
    <div>
      <h3>Account unavailable</h3>
      <p th:text="${errorMessage}">That account is not available for your DigiBank profile.</p>
    </div>
  </div>
  <a class="btn btn-gotologin" th:href="@{/customer/dashboard}">Back to Dashboard</a>
</main>
<div th:replace="~{fragments/customer-layout :: footer}"></div>
</body>
</html>
