<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Payments - DigiBank</title><link rel="icon" type="image/png" th:href="@{/images/logo/logo.png}"><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/customer.css}"></head><body class="customer-shell"><div th:replace="~{fragments/customer-layout :: topbar}"></div><main class="customer-layout"><div th:replace="~{fragments/customer-layout :: sidebar}"></div><section class="customer-content"><div th:replace="~{fragments/customer-layout :: alerts}"></div>
<div class="welcome-band bill-hero"><div><p class="eyebrow">Payments centre</p><h1>Bill payments</h1><span>Track every utility and service payment from one place.</span></div><div class="welcome-actions"><a class="btn btn-prev" th:href="@{/customer/bill-payments/schedules}">Scheduled bills</a><a class="btn btn-prev" th:href="@{/customer/bill-payments/billers}">Saved billers</a><a class="btn btn-save" th:href="@{/customer/bill-payments/new}">Pay a bill</a></div></div>
<form class="list-filter" method="get"><input name="q" th:value="${query}" placeholder="Reference or provider"><select name="category"><option value="">All categories</option><option th:each="c:${billerCategories}" th:value="${c}" th:text="${c.displayName}" th:selected="${c==selectedCategory}"></option></select><button class="btn btn-save">Filter</button></form>
<div class="empty-state" th:if="${#lists.isEmpty(payments)}"><h2>No bill payments yet</h2><p>Your completed bill receipts will appear here.</p><a class="btn btn-save" th:href="@{/customer/bill-payments/new}">Make first payment</a></div>
<section class="bill-history-grid" th:unless="${#lists.isEmpty(payments)}"><a class="bill-history-card" th:each="p : ${payments}" th:href="@{/customer/bill-payments/{ref}(ref=${p.referenceNumber})}"><span class="bill-category-icon" th:text="${p.category.icon}">⚡</span><span class="bill-history-copy"><strong th:text="${p.providerName}">Provider</strong><small th:text="${p.maskedConsumerReference + ' · ' + #temporals.format(p.paidAt, 'dd MMM yyyy, HH:mm')}">Reference</small><em th:text="${p.referenceNumber}">BIL</em></span><span class="bill-history-amount"><strong th:text="${'LKR ' + #numbers.formatDecimal(p.amount, 1, 2)}">LKR</strong><small th:text="${p.status}">COMPLETED</small></span></a></section>
<nav class="list-pagination" th:if="${paymentsPage.totalPages>1}"><a th:if="${paymentsPage.hasPrevious()}" th:href="@{/customer/bill-payments(q=${query},category=${selectedCategory},page=${paymentsPage.number-1},size=${paymentsPage.size})}">Previous</a><span th:text="${'Page '+(paymentsPage.number+1)+' of '+paymentsPage.totalPages}"></span><a th:if="${paymentsPage.hasNext()}" th:href="@{/customer/bill-payments(q=${query},category=${selectedCategory},page=${paymentsPage.number+1},size=${paymentsPage.size})}">Next</a></nav>
</section></main><div th:replace="~{fragments/customer-layout :: footer}"></div></body></html>
