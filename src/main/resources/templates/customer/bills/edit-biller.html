<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Biller - DigiBank</title><link rel="icon" type="image/png" th:href="@{/images/logo/logo.png}"><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/customer.css}"></head><body class="customer-shell"><div th:replace="~{fragments/customer-layout :: topbar}"></div><main class="customer-layout"><div th:replace="~{fragments/customer-layout :: sidebar}"></div><section class="customer-content"><div th:replace="~{fragments/customer-layout :: alerts}"></div><div class="welcome-band bill-hero"><div><p class="eyebrow">Saved biller</p><h1>Edit biller</h1><span>Update the provider, nickname or service reference.</span></div><a class="btn" th:href="@{/customer/bill-payments/billers}">Back</a></div><form class="bill-form-card" th:action="@{/customer/bill-payments/billers/{id}/edit(id=${billerId})}" th:object="${savedBillerRequest}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="bill-field"><span>Provider</span><select th:field="*{provider}" required><option value="">Select provider</option><option th:each="p:${providers}" th:value="${p}" th:text="${p.displayName}"></option></select></label><label class="bill-field"><span>Nickname</span><input th:field="*{nickname}" maxlength="80" required></label><label class="bill-field"><span>Consumer / service reference</span><input th:field="*{consumerReference}" maxlength="50" required></label><div class="field-error" th:if="${#fields.hasErrors('*')}" th:each="err:${#fields.errors('*')}" th:text="${err}"></div><button class="btn btn-save" type="submit">Save changes</button></form></section></main><div th:replace="~{fragments/customer-layout :: footer}"></div></body></html>
