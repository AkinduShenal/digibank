<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Billers - DigiBank</title><link rel="icon" type="image/png" th:href="@{/images/logo/logo.png}"><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/customer.css}"></head><body class="customer-shell"><div th:replace="~{fragments/customer-layout :: topbar}"></div><main class="customer-layout"><div th:replace="~{fragments/customer-layout :: sidebar}"></div><section class="customer-content"><div th:replace="~{fragments/customer-layout :: alerts}"></div>
<div class="welcome-band bill-hero"><div><p class="eyebrow">Quick payments</p><h1>Saved billers</h1><span>Store your frequent service references safely.</span></div><a class="btn btn-save" th:href="@{/customer/bill-payments/new}">Pay a bill</a></div><div class="saved-biller-layout"><section class="bill-form-card"><h2>Your billers</h2><div class="empty-state compact" th:if="${#lists.isEmpty(billers)}">No saved billers yet.</div><div class="saved-biller-list"><article th:each="b : ${billers}"><span class="bill-category-icon" th:text="${b.category.icon}">⚡</span><div><strong th:text="${b.nickname}">Home</strong><small th:text="${b.providerName + ' · ' + b.maskedReference}">Provider</small></div><form th:action="@{/customer/bill-payments/billers/{id}/delete(id=${b.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Remove</button></form></article></div></section>
<form class="bill-form-card" th:action="@{/customer/bill-payments/billers}" th:object="${savedBillerRequest}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><p class="eyebrow">Add new</p><h2>Save a biller</h2><label class="bill-field"><span>Provider</span><select th:field="*{provider}" required><option value="">Select provider</option><option th:each="p : ${providers}" th:value="${p}" th:text="${p.displayName}"></option></select></label><label class="bill-field"><span>Nickname</span><input th:field="*{nickname}" placeholder="e.g. Home electricity" maxlength="80" required></label><label class="bill-field"><span>Consumer / service reference</span><input th:field="*{consumerReference}" maxlength="50" required></label><div class="field-error" th:if="${#fields.hasErrors('*')}" th:each="err : ${#fields.errors('*')}" th:text="${err}"></div><button class="btn btn-save" type="submit">Save biller</button></form></div>
</section></main><div th:replace="~{fragments/customer-layout :: footer}"></div></body></html>
