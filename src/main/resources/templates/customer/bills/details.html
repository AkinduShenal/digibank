<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Receipt - DigiBank</title><link rel="icon" type="image/png" th:href="@{/images/logo/logo.png}"><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/customer.css}"></head><body class="customer-shell"><div th:replace="~{fragments/customer-layout :: topbar}"></div><main class="customer-layout"><div th:replace="~{fragments/customer-layout :: sidebar}"></div><section class="customer-content"><div th:replace="~{fragments/customer-layout :: alerts}"></div>
<div class="bill-receipt"><div class="receipt-success">✓</div><p class="eyebrow">Payment successful</p><h1 th:text="${'LKR ' + #numbers.formatDecimal(payment.amount, 1, 2)}">LKR 0.00</h1><p th:text="${'Paid to ' + payment.providerName}">Paid to provider</p><div class="receipt-grid"><div><span>Payment reference</span><strong th:text="${payment.referenceNumber}">BIL</strong></div><div><span>Paid on</span><strong th:text="${#temporals.format(payment.paidAt, 'dd MMM yyyy, HH:mm')}">Date</strong></div><div><span>Service reference</span><strong th:text="${payment.maskedConsumerReference}">****</strong></div><div><span>Source account</span><strong th:text="${payment.maskedSourceAccount}">****</strong></div><div><span>Category</span><strong th:text="${payment.category.displayName}">Category</strong></div><div><span>Balance after</span><strong th:text="${'LKR ' + #numbers.formatDecimal(payment.sourceBalanceAfter, 1, 2)}">LKR</strong></div><div class="wide" th:if="${payment.description}"><span>Description</span><strong th:text="${payment.description}">Note</strong></div></div><div class="form-actions"><a class="btn btn-prev" th:href="@{/customer/bill-payments}">View history</a><a class="btn btn-save" th:href="@{/customer/bill-payments/new}">Pay another bill</a></div></div>
</section></main><div th:replace="~{fragments/customer-layout :: footer}"></div></body></html>
