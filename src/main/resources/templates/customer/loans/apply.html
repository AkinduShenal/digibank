<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apply for a Loan - DigiBank</title>
  <link rel="icon" type="image/png" th:href="@{/images/logo/logo.png}">
  <link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body class="customer-shell">
<div th:replace="~{fragments/customer-layout :: topbar}"></div>
<main class="customer-layout"><div th:replace="~{fragments/customer-layout :: sidebar}"></div>
  <section class="customer-content">
    <div th:replace="~{fragments/customer-layout :: alerts}"></div>
    <div class="welcome-band"><div><p class="eyebrow">New application</p><h1>Apply for a loan</h1><span>Applications are reviewed by authorised bank staff</span></div></div>
    <div class="empty-state" th:if="${#lists.isEmpty(form.accounts)}"><h2>No eligible account</h2><p>You need an active LKR account before applying.</p></div>
    <form class="edit-card loan-form" th:unless="${#lists.isEmpty(form.accounts)}" th:action="@{/customer/loans}" th:object="${loanApplicationRequest}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="field"><label>Disbursement account</label><select th:field="*{accountNumber}"><option value="">Select account</option>
        <option th:each="account : ${form.accounts}" th:value="${account.accountNumber}" th:text="${account.accountType + ' · ' + account.accountNumber}"></option></select>
        <small class="field-error" th:errors="*{accountNumber}"></small></div>
      <div class="field"><label>Loan type</label><select id="loanType" th:field="*{loanType}"><option value="">Select type</option>
        <option th:each="type : ${form.loanTypes}" th:value="${type}" th:text="${type.displayName + ' · ' + type.annualInterestRate + '% p.a.'}"></option></select>
        <small class="field-error" th:errors="*{loanType}"></small></div>
      <div class="field"><label>Requested amount (LKR)</label><input id="requestedAmount" type="number" min="50000" max="5000000" step="0.01" th:field="*{requestedAmount}">
        <small class="field-error" th:errors="*{requestedAmount}"></small></div>
      <div class="field"><label>Term (months)</label><input id="termMonths" type="number" min="6" max="60" th:field="*{termMonths}">
        <small class="field-error" th:errors="*{termMonths}"></small></div>
      <div class="field"><label>Monthly income (LKR)</label><input type="number" min="1" step="0.01" th:field="*{monthlyIncome}">
        <small class="field-error" th:errors="*{monthlyIncome}"></small></div>
      <div class="field"><label>Employment status</label><input maxlength="80" placeholder="e.g. Permanent employee" th:field="*{employmentStatus}">
        <small class="field-error" th:errors="*{employmentStatus}"></small></div>
      <div class="field wide"><label>Loan purpose</label><textarea rows="4" maxlength="500" th:field="*{purpose}" placeholder="Describe how the funds will be used"></textarea>
        <small class="field-error" th:errors="*{purpose}"></small></div>
      <div class="loan-estimate wide"><strong>Affordability rule</strong><span>The estimated installment must not exceed 40% of your declared monthly income.</span></div>
      <div class="form-actions wide"><a class="btn btn-prev" th:href="@{/customer/loans}">Cancel</a><button class="btn btn-save" type="submit">Submit application</button></div>
    </form>
  </section>
</main><div th:replace="~{fragments/customer-layout :: footer}"></div>
</body></html>
