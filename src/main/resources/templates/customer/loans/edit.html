<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Loan - DigiBank</title><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/customer.css}"></head><body class="customer-shell"><div th:replace="~{fragments/customer-layout :: topbar}"></div><main class="customer-layout"><div th:replace="~{fragments/customer-layout :: sidebar}"></div><section class="customer-content"><div th:replace="~{fragments/customer-layout :: alerts}"></div><div class="welcome-band"><div><p class="eyebrow">Pending application</p><h1>Edit loan application</h1><span th:text="${applicationNumber}"></span></div></div>
<form class="edit-card loan-form" th:action="@{/customer/loans/{n}/edit(n=${applicationNumber})}" th:object="${loanApplicationRequest}" method="post" enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="field"><label>Disbursement account</label><select th:field="*{accountNumber}"><option th:each="a:${form.accounts}" th:value="${a.accountNumber}" th:text="${a.accountType+' · '+a.accountNumber}"></option></select></div><div class="field"><label>Loan type</label><select th:field="*{loanType}"><option th:each="t:${form.loanTypes}" th:value="${t}" th:text="${t.displayName+' · '+t.annualInterestRate+'% p.a.'}"></option></select></div><div class="field"><label>Requested amount</label><input type="number" min="50000" max="5000000" step="0.01" th:field="*{requestedAmount}"></div><div class="field"><label>Term (months)</label><input type="number" min="6" max="60" th:field="*{termMonths}"></div><div class="field"><label>Monthly income</label><input type="number" min="1" step="0.01" th:field="*{monthlyIncome}"></div><div class="field"><label>Employment status</label><input maxlength="80" th:field="*{employmentStatus}"></div><div class="field wide"><label>Purpose</label><textarea maxlength="500" rows="4" th:field="*{purpose}"></textarea></div><div class="field wide"><label>Current supporting document</label><input maxlength="255" th:field="*{supportingDocumentReference}" readonly><label>Replace document (optional)</label><input type="file" th:field="*{supportingDocument}" accept="application/pdf,image/jpeg,image/png"><small>PDF, JPEG or PNG, maximum 5 MB.</small></div><div class="auth-alert error wide" th:if="${#fields.hasAnyErrors()}">Please correct the highlighted details.</div><div class="form-actions wide"><a class="btn btn-prev" th:href="@{/customer/loans/{n}(n=${applicationNumber})}">Cancel</a><button class="btn btn-save" type="submit">Save changes</button></div></form>
</section></main><div th:replace="~{fragments/customer-layout :: footer}"></div></body></html>
