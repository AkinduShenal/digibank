<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password - DigiBank</title><link rel="stylesheet" th:href="@{/css/auth.css}"></head><body class="auth-page"><main class="auth-card"><div class="auth-copy"><p class="eyebrow">Account recovery</p><h1>Reset your password</h1><p>Enter your username or email. The response is identical whether or not an account exists.</p><div class="auth-alert ok" th:if="${requested}">If a matching account exists, a reset link has been created.</div><a class="primary-button" th:if="${resetToken}" th:href="@{/reset-password(token=${resetToken})}">Open local development reset link</a><form th:action="@{/forgot-password}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Username or email<input name="identifier" required autocomplete="username"></label><button class="primary-button" type="submit">Request reset</button></form><a th:href="@{/login}">Back to sign in</a></div></main></body></html>
