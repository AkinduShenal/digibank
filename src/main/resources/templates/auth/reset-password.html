<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose Password - DigiBank</title><link rel="stylesheet" th:href="@{/css/auth.css}"></head><body class="auth-page"><main class="auth-card"><div class="auth-copy"><p class="eyebrow">Secure recovery</p><h1>Choose a new password</h1><div class="auth-alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div><div class="auth-alert error" th:unless="${valid}">This reset link is invalid or has expired.</div><form th:if="${valid}" th:action="@{/reset-password}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="token" th:value="${token}"><label>New password<input type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirmation" minlength="8" maxlength="72" required autocomplete="new-password"></label><button class="primary-button" type="submit">Update password</button></form><a th:href="@{/login}">Back to sign in</a></div></main></body></html>
