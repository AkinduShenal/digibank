<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Audit - DigiBank</title><link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/staff.css}"></head><body class="staff-shell"><div th:replace="~{fragments/staff-layout :: topbar}"></div><div class="staff-layout"><div th:replace="~{fragments/staff-layout :: sidebar('audit')}"></div><main class="staff-main"><section class="staff-page-head"><div><p class="staff-eyebrow">Governance</p><h1>Administrator audit log</h1><p th:text="${auditCount+' immutable operational events recorded'}"></p></div></section><form class="staff-filter" method="get"><label>Search actor, action or reference<input name="q" th:value="${query}" placeholder="Search audit records"></label><button class="staff-btn primary" type="submit">Search</button></form><section class="staff-panel"><div class="staff-empty" th:if="${logs.empty}">No audit events match this search.</div><div class="staff-table-wrap" th:unless="${logs.empty}"><table class="staff-table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Status change</th><th>Reason</th></tr></thead><tbody><tr th:each="log:${logs.content}"><td th:text="${#temporals.format(log.occurredAt,'dd MMM yyyy HH:mm:ss')}"></td><td th:text="${log.actorUsername}"></td><td th:text="${log.action}"></td><td th:text="${log.targetType+' · '+log.targetIdentifier}"></td><td th:text="${(log.previousStatus?:'—')+' → '+(log.newStatus?:'—')}"></td><td th:text="${log.reason?:'—'}"></td></tr></tbody></table></div><div class="pagination" th:if="${logs.totalPages>1}"><a th:if="${logs.hasPrevious()}" th:href="@{/admin/dashboard(page=${logs.number-1},q=${query})}">Previous</a><span th:text="${'Page '+(logs.number+1)+' of '+logs.totalPages}"></span><a th:if="${logs.hasNext()}" th:href="@{/admin/dashboard(page=${logs.number+1},q=${query})}">Next</a></div></section></main></div><div th:replace="~{fragments/staff-layout :: footer}"></div></body></html>
