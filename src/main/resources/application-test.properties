# Isolated test profile.
# No embedded test database dependency is configured yet, so tests should not
# connect to a developer's main MySQL database.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
spring.datasource.url=${DIGIBANK_TEST_DB_URL:jdbc:mysql://localhost:3306/digibank_test_db}
spring.datasource.username=${DIGIBANK_TEST_DB_USERNAME:root}
spring.datasource.password=${DIGIBANK_TEST_DB_PASSWORD:}
# Temporary non-destructive default. When a test schema exists, set DIGIBANK_TEST_JPA_DDL_AUTO=validate.
spring.jpa.hibernate.ddl-auto=${DIGIBANK_TEST_JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.main.lazy-initialization=true
